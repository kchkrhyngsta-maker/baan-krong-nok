<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปลี่ยนรหัสผ่าน | บ้านกรงนก</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: #FAFCF7;
      color: #294C35;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(41,76,53,0.10);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #66806C;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #D8E5D5;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
      margin-bottom: 17px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #39764A;
      color: white;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.6;
    }

    .success {
      display: block !important;
      background: #E7F5E8;
      color: #28613B;
    }

    .error {
      display: block !important;
      background: #FCEAEA;
      color: #A52A2A;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #39764A;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🐦 บ้านกรงนก</h1>

  <p class="subtitle">ตั้งรหัสผ่านใหม่สำหรับผู้ดูแลร้าน</p>

  <form id="passwordForm" hidden>

    <label for="password">รหัสผ่านใหม่</label>
    <input
      type="password"
      id="password"
      minlength="8"
      required
      placeholder="กรอกรหัสผ่านใหม่อย่างน้อย 8 ตัว"
    >

    <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
    <input
      type="password"
      id="confirmPassword"
      minlength="8"
      required
      placeholder="กรอกรหัสผ่านอีกครั้ง"
    >

    <button type="submit" id="submitButton">
      บันทึกรหัสผ่านใหม่
    </button>

  </form>

  <div id="message">กำลังตรวจสอบลิงก์...</div>

  <a class="back" href="admin-login.html">
    กลับไปหน้าเข้าสู่ระบบ
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    'https://acfrebknwxuybroilgqu.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK';

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById('passwordForm');
  const message = document.getElementById('message');
  const button = document.getElementById('submitButton');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  async function checkRecoverySession() {
    try {
      const { data, error } = await client.auth.getSession();

      if (error) throw error;

      if (data.session) {
        form.hidden = false;
        message.style.display = 'none';
        return;
      }

      showMessage(
        'ไม่พบเซสชันสำหรับเปลี่ยนรหัสผ่าน กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่จากอีเมล',
        'error'
      );

    } catch (error) {
      showMessage(
        'ไม่สามารถตรวจสอบลิงก์ได้ กรุณาขอลิงก์ใหม่อีกครั้ง',
        'error'
      );
    }
  }

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      showMessage('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showMessage('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'กำลังบันทึก...';

    try {
      const { data, error } = await client.auth.updateUser({
        password: password
      });

      if (error) throw error;

      showMessage(
        'เปลี่ยนรหัสผ่านสำเร็จแล้ว สามารถเข้าสู่ระบบผู้ดูแลร้านได้',
        'success'
      );

      form.hidden = true;

      setTimeout(function() {
        window.location.href = 'admin-login.html';
      }, 3000);

    } catch (error) {
      showMessage(
        'ไม่สามารถเปลี่ยนรหัสผ่านได้: ' + error.message,
        'error'
      );

      button.disabled = false;
      button.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  });

  checkRecoverySession();
</script>

</body>
</html>
