<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดสินค้า | บ้านกรงนก</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #FAFCF7;
  color: #294C35;
  font-family: Arial, sans-serif;
}
header {
  background: #174d2b;
  color: white;
  text-align: center;
  padding: 18px;
}
main {
  max-width: 750px;
  margin: auto;
  padding: 18px;
}
.back {
  display: inline-block;
  margin-bottom: 15px;
  color: #174d2b;
  text-decoration: none;
  font-weight: bold;
}
.product {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 2px 8px #ddd;
}
.product-image {
  width: 100%;
  height: 320px;
  object-fit: contain;
  background: #f1f1e9;
  border-radius: 12px;
}
.no-image {
  height: 280px;
  display: grid;
  place-items: center;
  font-size: 90px;
  background: #f1f1e9;
  border-radius: 12px;
}
h2 {
  font-size: 23px;
}
.price {
  font-size: 27px;
  color: #16834a;
  font-weight: bold;
  margin: 12px 0;
}
.category {
  color: #777;
}
.description {
  line-height: 1.8;
  white-space: pre-line;
}
.status {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 20px;
  background: #e8f5e9;
  color: #16834a;
  font-size: 14px;
  margin: 8px 0;
}
.stock {
  color: #555;
}
input {
  padding: 13px;
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 8px;
}
button {
  width: 100%;
  padding: 14px;
  background: #18834a;
  color: white;
  border: 0;
  border-radius: 25px;
  margin-top: 15px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #126638;
}
button:disabled {
  background: #999;
  cursor: not-allowed;
}
.message {
  text-align: center;
  padding: 25px;
}
footer {
  background: #174d2b;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 35px;
}
@media(max-width:480px) {
  .product-image {
    height: 240px;
  }
  .product {
    padding: 14px;
  }
}
</style>
</head>
<body>
<header>
  <h2>🐦 บ้านกรงนก</h2>
  <p>รายละเอียดสินค้า</p>
</header>
<main>

← กลับไปหน้าสินค้า

<div class="product" id="detail">
  <div class="message">กำลังโหลดสินค้า...</div>
</div>
</main>
<footer>
  <h3>🐦 บ้านกรงนก</h3>
  <p>กรงนกสวยงามและอุปกรณ์ตกแต่ง</p>
</footer>
<script>
// ตั้งค่า Supabase
const SUPABASE_URL =
"https://acfrebknwxuybroilgqu.supabase.co";
const SUPABASE_KEY =
"sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK";
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
// รับรหัสสินค้าจาก URL
const params = new URLSearchParams(location.search);
const id = params.get("id");
function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}
function safeImage(value) {
  if (!value) return "";
  try {
    const url = new URL(value);
    if (url.protocol === "https:" || url.protocol === "http:") {
      return url.href;
    }
  } catch {}
  return "";
}
function formatPrice(price) {
  if (price === null || price === undefined || price === "") {
    return "ยังไม่ได้ระบุราคา";
  }
  const number = Number(price);
  if (!Number.isFinite(number)) {
    return "ยังไม่ได้ระบุราคา";
  }
  return "฿" + number.toLocaleString("th-TH");
}
async function loadProduct() {
  const box = document.getElementById("detail");
  if (!id || !/^\d+$/.test(id)) {
    box.innerHTML = '<div class="message">ไม่พบรหัสสินค้า</div>';
    return;
  }
  try {
    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("id", id)
      .eq("is_active", true)
      .maybeSingle();
    if (error) throw error;
    if (!data) {
      box.innerHTML = '<div class="message">ไม่พบสินค้า</div>';
      return;
    }
    const image = safeImage(data.image_url);
    const stock = Number(data.stock ?? 0);
    const fulfillmentType = data.fulfillment_type || "ready_to_ship";
    const isPreorder = fulfillmentType === "preorder";
    const statusText = isPreorder
      ? "สินค้าสั่งจอง / ผลิตตามคำสั่งซื้อ"
      : "สินค้าพร้อมส่ง";
    const productionText = isPreorder && data.production_days
      ? `<p>ระยะเวลาผลิตประมาณ ${Number(data.production_days)} วัน</p>`
      : "";
    box.innerHTML = `
      ${
        image
        ? `<img class="product-image"
             src="${safe(image)}"
             alt="${safe(data.name)}"
             onerror="this.outerHTML='<div class=no-image>🐦</div>'">`
        : '<div class="no-image">🐦</div>'
      }
      <h2>${safe(data.name)}</h2>
      <p class="category">
        หมวดหมู่: ${safe(data.category || "ไม่ระบุหมวดหมู่")}
      </p>
      <div class="price">
        ${formatPrice(data.price)}
      </div>
      <p class="description">
        ${safe(data.description || "ยังไม่มีรายละเอียดสินค้า")}
      </p>
      <span class="status">${statusText}</span>
      ${productionText}
      <p class="stock">
        ${
          isPreorder
          ? "สินค้าสั่งจอง กรุณาตรวจสอบรายละเอียดก่อนสั่งซื้อ"
          : "สินค้าคงเหลือ " + stock.toLocaleString("th-TH") + " ชิ้น"
        }
      </p>
      <label for="quantity">จำนวนที่ต้องการ</label>
      <input
        id="quantity"
        type="number"
        min="1"
        ${!isPreorder ? `max="${Math.max(0, stock)}"` : ""}
        value="1"
      >
      <button id="buy">
        สั่งซื้อสินค้านี้
      </button>
    `;
    document.getElementById("buy").onclick = () => {
      const quantity = Number(
        document.getElementById("quantity").value
      );
      if (!Number.isInteger(quantity) || quantity < 1) {
        alert("กรุณาระบุจำนวนสินค้าให้ถูกต้อง");
        return;
      }
      if (!isPreorder && quantity > stock) {
        alert("จำนวนสินค้าไม่เพียงพอ");
        return;
      }
      if (data.price === null || data.price === undefined || data.price === "") {
        alert("สินค้านี้ยังไม่ได้ระบุราคา กรุณาติดต่อร้าน");
        return;
      }
      location.href =
        "order.html?id=" +
        encodeURIComponent(data.id) +
        "&quantity=" + quantity;
    };
    if (!isPreorder && stock <= 0) {
      document.getElementById("buy").disabled = true;
      document.getElementById("buy").textContent = "สินค้าหมด";
    }
  } catch (error) {
    console.error("Product detail error:", error);
    box.innerHTML = `
      <div class="message">
        <h3>ไม่สามารถโหลดรายละเอียดสินค้าได้</h3>
        <p>${safe(error.message)}</p>
      </div>
    `;
  }
}
loadProduct();
</script>
</body>
</html>
