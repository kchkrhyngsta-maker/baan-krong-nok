
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดสินค้า | บ้านกรงนก</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8ef;color:#17452b;font-family:Arial}
header{background:#174d2b;color:white;text-align:center;padding:18px}
main{max-width:650px;margin:auto;padding:18px}
.product{background:white;padding:16px;border-radius:16px}
img{width:100%;height:280px;object-fit:contain;background:#f1f1e9;border-radius:12px}
h2{font-size:22px}
.price{font-size:25px;color:#16834a;font-weight:bold}
p{line-height:1.7}
input{padding:12px;width:100%;border:1px solid #ccc;border-radius:10px}
button{width:100%;padding:13px;background:#18834a;color:white;border:0;border-radius:25px;margin-top:12px;font-size:16px}
a{color:#174d2b}
</style>
</head>
<body>

<header>
<h2>🐦 บ้านกรงนก</h2>
รายละเอียดสินค้า
</header>

<main>
<a href="products.html">← กลับไปหน้าสินค้า</a>

<div class="product" id="detail">
กำลังโหลดสินค้า...
</div>
</main>

<script>
const SUPABASE_URL = "https://acfrebknwxuybroilgqu.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK";

const db = window.supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

const params = new URLSearchParams(location.search);
const id = params.get("id");

function safe(v){
 return String(v ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

async function loadProduct(){
 const box = document.getElementById("detail");

 if(!id || !/^\d+$/.test(id)){
  box.textContent="ไม่พบรหัสสินค้า";
  return;
 }

 const {data,error}=await db
 .from("products")
 .select("*")
 .eq("id",id)
 .eq("is_active",true)
 .maybeSingle();

 if(error || !data){
  box.textContent="ไม่พบสินค้า";
  return;
 }

 const image = data.image_url || "";

 box.innerHTML=`
  ${image ? `<img src="${safe(image)}" alt="${safe(data.name)}">` :
  `<div style="font-size:90px;text-align:center">🐦</div>`}
  <h2>${safe(data.name)}</h2>
  <p>${safe(data.category)}</p>
  <div class="price">฿${Number(data.price).toLocaleString("th-TH")}</div>
  <p>${safe(data.description || "ไม่มีรายละเอียดเพิ่มเติม")}</p>
  <p>สินค้าคงเหลือ ${Number(data.stock)} ชิ้น</p>
  <label>จำนวนที่ต้องการ</label>
  <input id="quantity" type="number" min="1"
   max="${Math.max(0,Number(data.stock))}" value="1">
  <button id="buy">สั่งซื้อสินค้านี้</button>
 `;

 document.getElementById("buy").onclick=()=>{
  const quantity=Number(document.getElementById("quantity").value);

  if(!Number.isInteger(quantity)||quantity<1||
     quantity>Number(data.stock)){
   alert("กรุณาตรวจสอบจำนวนสินค้า");
   return;
  }

  location.href="order.html?id="+
   encodeURIComponent(data.id)+
   "&quantity="+quantity;
 };
}

loadProduct();
</script>
</body>
</html>
