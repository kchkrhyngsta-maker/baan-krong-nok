
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="บ้านกรงนก จำหน่ายกรงนกสวยงามและอุปกรณ์สำหรับคนรักนก">
  <title>บ้านกรงนก | Baan Krong Nok</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green-dark: #214B32;
      --green: #39764A;
      --green-medium: #65966A;
      --green-light: #E5F0E2;
      --green-pale: #F4F8F1;
      --text: #294735;
      --white: #FFFFFF;
      --border: #DCE9D8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: var(--green-pale);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    header {
      background: var(--white);
      padding: 12px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 3px solid var(--green-light);
      box-shadow: 0 3px 15px rgba(33,75,50,0.10);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    /* LOGO: แสดงภาพครบภายในวงกลม */

    .brand-logo {
      width: 105px;
      height: 105px;
      min-width: 105px;
      border-radius: 50%;
      border: 4px solid var(--green);
      background: var(--green-light);
      padding: 3px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: contain;
      object-position: center;
    }

    .brand h1 {
      font-size: 26px;
      font-weight: 600;
      color: var(--green-dark);
      line-height: 1.4;
    }

    .brand p {
      font-size: 13px;
      color: var(--green-medium);
    }

    /* NAVIGATION */

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 17px;
    }

    nav a {
      color: var(--green-dark);
      font-size: 15px;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: var(--green-medium);
    }

    /* HERO */

    .hero {
      padding: 85px 20px;
      text-align: center;
      background: linear-gradient(135deg, #D7EAD2, #F0F7EC, #DCEEDB);
    }

    .hero-label {
      display: inline-block;
      background: white;
      color: var(--green);
      padding: 6px 20px;
      border-radius: 30px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .hero h2 {
      color: var(--green-dark);
      font-size: 36px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #54765A;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .main-button {
      display: inline-block;
      background: var(--green);
      color: white;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 500;
      transition: 0.3s;
    }

    .main-button:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .outline-button {
      display: inline-block;
      border: 2px solid var(--green);
      color: var(--green);
      padding: 10px 25px;
      border-radius: 30px;
      margin-left: 8px;
      font-weight: 500;
    }

    .outline-button:hover {
      background: var(--green);
      color: white;
    }

    /* GENERAL SECTIONS */

    section {
      padding: 55px 5%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .section-title h2 {
      font-size: 28px;
      color: var(--green-dark);
    }

    .section-title p {
      color: #69866D;
      margin-top: 5px;
    }

    /* CATEGORY */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 18px;
      max-width: 1100px;
      margin: auto;
    }

    .category-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(33,75,50,0.07);
      transition: 0.3s;
    }

    .category-card:hover {
      transform: translateY(-5px);
      border-color: var(--green-medium);
    }

    .category-card .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .category-card h3 {
      font-size: 16px;
      color: var(--green-dark);
    }

    /* PRODUCTS */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(33,75,50,0.08);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: var(--green-light);
    }

    .product-image-placeholder {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-light);
      color: var(--green);
      font-size: 42px;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      font-size: 17px;
      color: var(--green-dark);
      margin-bottom: 6px;
    }

    .product-price {
      color: var(--green);
      font-weight: 600;
      font-size: 19px;
    }

    .product-status {
      font-size: 13px;
      color: #78917A;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--green);
      grid-column: 1 / -1;
    }

    .center {
      text-align: center;
      margin-top: 28px;
    }

    /* FEATURES */

    .features {
      background: var(--green-light);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .feature-item {
      background: white;
      padding: 28px 15px;
      border-radius: 17px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(33,75,50,0.05);
    }

    .feature-item .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .feature-item h3 {
      color: var(--green-dark);
      margin-bottom: 5px;
    }

    .feature-item p {
      color: #69866D;
    }

    /* ABOUT */

    .about-box {
      max-width: 850px;
      margin: auto;
      padding: 32px;
      text-align: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(33,75,50,0.07);
    }

    .about-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .about-box h3 {
      color: var(--green-dark);
      margin-bottom: 12px;
    }

    /* HOW TO ORDER */

    .how-order {
      background: #EFF6EC;
    }

    /* FAQ */

    .faq-list {
      max-width: 850px;
      margin: auto;
    }

    .faq-list details {
      background: white;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .faq-list summary {
      font-weight: 500;
      color: var(--green-dark);
      cursor: pointer;
    }

    .faq-list details p {
      padding-top: 12px;
      color: #69866D;
    }

    /* CONTACT */

    .contact {
      text-align: center;
      background: var(--green-light);
    }

    .contact-card {
      background: white;
      padding: 25px 15px;
      border-radius: 17px;
      border: 1px solid var(--border);
    }

    .contact-card .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .contact-card h3 {
      color: var(--green-dark);
      margin-bottom: 5px;
    }

    .contact-card p {
      color: #69866D;
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      background: var(--green-dark);
      color: white;
      padding: 35px 15px;
      text-align: center;
    }

    footer h3 {
      margin-bottom: 8px;
    }

    footer p {
      margin: 5px 0;
      font-size: 14px;
      color: #E1EDDF;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin: 18px 0;
    }

    .footer-links a {
      color: white;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: #B8D5AC;
    }

    /* BACK TO TOP */

    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 45px;
      height: 45px;
      background: var(--green);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      z-index: 99;
    }

    .back-to-top:hover {
      background: var(--green-dark);
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        justify-content: center;
        padding: 12px 15px;
      }

      .brand-logo {
        width: 85px;
        height: 85px;
        min-width: 85px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .brand p {
        font-size: 11px;
      }

      nav {
        justify-content: center;
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      .hero {
        padding: 55px 15px;
      }

      .hero h2 {
        font-size: 27px;
      }

      .hero p {
        font-size: 15px;
      }
