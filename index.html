
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>บ้านกรงนก | Baan Krong Nok</title>
  <meta name="description" content="บ้านกรงนก จำหน่ายกรงนกสวยงาม กรงนกไม้ กรงเหล็ก และอุปกรณ์สำหรับคนรักนก">

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: #FAFCF7;
      color: #294C35;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    header {
      background: #FFFFFF;
      padding: 12px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 3px 12px rgba(36,75,53,0.10);
      border-bottom: 2px solid #E5EFE2;
    }

    /* LOGO */

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 3px solid #3F7650;
      background: #E8F0E5;
      padding: 0;
      display: block;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 25px;
      color: #244B35;
      font-weight: 600;
    }

    .brand p {
      font-size: 13px;
      color: #64836A;
    }

    /* NAVIGATION */

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }

    nav a {
      font-size: 15px;
      font-weight: 500;
      color: #315B3E;
      transition: 0.3s;
    }

    nav a:hover {
      color: #82A875;
    }

    /* HERO */

    .hero {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(135deg, #DDEBD9, #F3F8EF);
    }

    .hero h2 {
      font-size: 34px;
      color: #244B35;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      color: #52735A;
      margin-bottom: 25px;
    }

    .hero-label {
      display: inline-block;
      color: #3F7650;
      background: #FFFFFF;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* BUTTON */

    .main-button {
      display: inline-block;
      padding: 12px 30px;
      background: #3F7650;
      color: white;
      border-radius: 30px;
      font-weight: 500;
      transition: 0.3s;
    }

    .main-button:hover {
      background: #244B35;
      transform: translateY(-2px);
    }

    .outline-button {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid #3F7650;
      color: #3F7650;
      border-radius: 30px;
      margin-left: 8px;
      font-weight: 500;
    }

    .outline-button:hover {
      background: #3F7650;
      color: white;
    }

    /* SECTION */

    section {
      padding: 55px 5%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .section-title h2 {
      font-size: 28px;
      color: #244B35;
    }

    .section-title p {
      color: #64836A;
      margin-top: 5px;
    }

    /* CATEGORY */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 18px;
      max-width: 1100px;
      margin: auto;
    }

    .category-card {
      background: #FFFFFF;
      border: 1px solid #E3EDDF;
      border-radius: 18px;
      padding: 25px 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(36,75,53,0.07);
      transition: 0.3s;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 7px 18px rgba(36,75,53,0.13);
    }

    .category-card .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .category-card h3 {
      font-size: 16px;
      color: #315B3E;
    }

    /* PRODUCTS */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .product-card {
      background: #FFFFFF;
      border: 1px solid #E3EDDF;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(36,75,53,0.08);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #E8F0E5;
    }

    .product-image-placeholder {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E8F0E5;
      color: #64836A;
      font-size: 42px;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      font-size: 17px;
      color: #294C35;
      margin-bottom: 6px;
    }

    .product-price {
      color: #3F7650;
      font-weight: 600;
      font-size: 19px;
    }

    .product-status {
      font-size: 13px;
      color: #78917A;
      margin-top: 5px;
    }

    .center {
      text-align: center;
      margin-top: 28px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64836A;
      grid-column: 1 / -1;
    }

    /* FEATURES */

    .features {
      background: #E8F0E5;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .feature-item {
      background: #FFFFFF;
      padding: 28px 15px;
      border-radius: 17px;
      border: 1px solid #DCE9D8;
      box-shadow: 0 3px 10px rgba(36,75,53,0.04);
    }

    .feature-item .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .feature-item h3 {
      color: #315B3E;
      margin-bottom: 5px;
    }

    .feature-item p {
      color: #64836A;
    }

    /* ABOUT */

    .about-box {
      max-width: 850px;
      margin: auto;
      padding: 32px;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #E3EDDF;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(36,75,53,0.07);
    }

    .about-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .about-box h3 {
      color: #315B3E;
      margin-bottom: 12px;
    }

    /* HOW TO ORDER */

    .how-order {
      background: #F1F6ED;
    }

    /* FAQ */

    .faq-list {
      max-width: 850px;
      margin: auto;
    }

    .faq-list details {
      background: #FFFFFF;
      padding: 18px 20px;
      border: 1px solid #E3EDDF;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .faq-list summary {
      font-weight: 500;
      color: #315B3E;
      cursor: pointer;
    }

    .faq-list details p {
      padding-top: 12px;
      color: #64836A;
    }

    /* CONTACT */

    .contact {
      text-align: center;
      background: #E8F0E5;
    }

    .contact-card {
      background: #FFFFFF;
      padding: 25px 15px;
      border-radius: 17px;
      border: 1px solid #DCE9D8;
    }

    .contact-card .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .contact-card h3 {
      color: #315B3E;
      margin-bottom: 5px;
    }

    .contact-card p {
      color: #64836A;
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      background: #244B35;
      color: #FFFFFF;
      padding: 35px 15px;
      text-align: center;
    }

    footer h3 {
      margin-bottom: 8px;
    }

    footer p {
      margin: 5px 0;
      font-size: 14px;
      color: #E1EDDF;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin: 18px 0;
    }

    .footer-links a {
      color: #FFFFFF;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: #B8D5AC;
    }

    /* BACK TO TOP */

    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 45px;
      height: 45px;
      background: #3F7650;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      z-index: 99;
    }

    .back-to-top:hover {
      background: #244B35;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        justify-content: center;
        padding: 12px 15px;
      }

      .brand img {
        width: 80px;
        height: 80px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .brand p {
        font-size: 11px;
      }

      nav {
        justify-content: center;
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      .hero {
        padding: 55px 15px;
      }

      .hero h2 {
        font-size: 27px;
      }

      .hero p {
        font-size: 15px;
      }

      section {
        padding: 40px 15px;
      }

      .section-title h2 {
        font-size: 24px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product-card img,
      .product-image-placeholder {
        height: 160px;
      }

      .product-info {
        padding: 12px;
      }

      .product-info h3 {
        font-size: 15px;
      }

      .product-price {
        font-size: 17px;
      }

      .about-box {
        padding: 22px 16px;
      }

      .outline-button {
        margin: 10px 0 0;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

      <img
        src="https://kchkrhyngsta-maker.github.io/baan-krong-nok/Logo.JPG"
