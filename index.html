
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บ้านกรงนก | Baan Krong Nok</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf8ef;
  color: #183e27;
}
header {
  background: #174d2b;
  color: white;
  padding: 18px;
  text-align: center;
}
header h1 { margin: 0; font-size: 27px; }
header p { margin: 6px 0 0; }
nav {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 14px 5px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 2px 6px #ddd;
}
nav a {
  color: #174d2b;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
}
.container {
  padding: 16px;
  max-width: 1000px;
  margin: auto;
}
.search {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 25px;
  font-size: 16px;
}
.banner {
  background: #e5edda;
  padding: 25px 18px;
  margin-top: 16px;
  border-radius: 18px;
  text-align: center;
}
.banner h2 { color: #174d2b; }
.banner p { color: #526b53; }
.section-title {
  margin-top: 25px;
  font-size: 21px;
}
.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 7px #ddd;
}
.card img {
  width: 100%;
  height: 145px;
  object-fit: cover;
  background: #eee;
}
.card-content { padding: 11px; }
.card h3 {
  font-size: 15px;
  margin: 3px 0 8px;
}
.price {
  color: #18834a;
  font-weight: bold;
  font-size: 17px;
}
.category {
  color: #777;
  font-size: 12px;
}
button {
  background: #18834a;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  margin-top: 8px;
  width: 100%;
  font-size: 14px;
}
footer {
  background: #174d2b;
  color: white;
  text-align: center;
  padding: 22px;
  margin-top: 35px;
}
.empty {
  text-align: center;
  padding: 30px;
  color: #777;
  grid-column: 1 / -1;
}
@media(min-width:650px) {
  .products { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

<body>

<header>
  <h1>🐦 บ้านกรงนก</h1>
  <p>กรงนกสวย ๆ สั่งได้ตามใจคุณ</p>
</header>

<nav>
  <a href="index.html">หน้าหลัก</a>
  <a href="#products">สินค้า</a>
  <a href="contact.html">ติดต่อเรา</a>
</nav>

<div class="container">

  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 ค้นหากรงนกและอุปกรณ์..."
  >

  <section class="banner">
    <h2>ยินดีต้อนรับสู่บ้านกรงนก</h2>
    <p>จำหน่ายกรงนกสวยงามทุกชนิด<br>
    พร้อมอะไหล่และอุปกรณ์ตกแต่งกรงนก</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
      เลือกชมสินค้า
    </button>
  </section>

  <h2 class="section-title" id="products">🛒 สินค้าแนะนำ</h2>

  <div id="product-list" class="products">
    <p class="empty">กำลังโหลดสินค้า...</p>
  </div>

</div>

<footer>
  <h3>🐦 บ้านกรงนก</h3>
  <p>ร้านจำหน่ายกรงนกและอุปกรณ์ตกแต่ง</p>
  <p>ขอบคุณที่เลือกซื้อสินค้ากับเรา</p>
</footer>

<script>
const SUPABASE_URL = "https://acfrebknwxuybroilgqu.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allProducts = [];

async function loadProducts() {
  const list = document.getElementById("product-list");

  const { data, error } = await db
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("id", { ascending: false });

  if (error) {
    list.innerHTML =
      '<p class="empty">ไม่สามารถโหลดสินค้าได้ กรุณาตรวจสอบการเชื่อมต่อ</p>';
    console.error(error);
    return;
  }

  allProducts = data || [];
  showProducts(allProducts);
}

function showProducts(items) {
  const list = document.getElementById("product-list");

  if (!items.length) {
    list.innerHTML =
      '<p class="empty">ยังไม่มีสินค้าในร้าน</p>';
    return;
  }

  list.innerHTML = items.map(item => `
    <article class="card">
      <img
        src="${safeImage(item.image_url)}"
        alt="${escapeHTML(item.name)}"
        onerror="this.style.display='none'"
      >
      <div class="card-content">
        <h3>${escapeHTML(item.name)}</h3>
        <p class="category">${escapeHTML(item.category || "")}</p>
        <p class="price">฿${Number(item.price).toLocaleString("th-TH")}</p>
        <button onclick="alert('สินค้า: ${escapeHTML(item.name)}')">
          ดูรายละเอียด
        </button>
      </div>
    </article>
  `).join("");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function safeImage(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol)
      ? escapeHTML(value)
      : "";
  } catch {
    return "";
  }
}

document.getElementById("search").addEventListener("input", e => {
  const keyword = e.target.value.toLowerCase();

  showProducts(allProducts.filter(item =>
    (item.name || "").toLowerCase().includes(keyword) ||
    (item.category || "").toLowerCase().includes(keyword)
  ));
});

loadProducts();
</script>

</body>
</html>
