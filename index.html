<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านกรงนก | Baan Krong Nok</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: #FAFCF7;
      color: #294C35;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: white;
      padding: 45px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(41, 76, 53, 0.10);
    }

    /* โลโก้รูปวงกลม */
    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #EDF4E9;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 5px;
      color: #294C35;
    }

    .english-name {
      font-size: 19px;
      color: #39764A;
      margin-bottom: 25px;
    }

    .description {
      font-size: 17px;
      line-height: 2;
      color: #555;
      margin-bottom: 18px;
    }

    .product-info {
      font-size: 16px;
      line-height: 2;
      color: #555;
      margin-bottom: 28px;
    }

    .next-button {
      display: inline-block;
      background: #39764A;
      color: white;
      text-decoration: none;
      padding: 13px 35px;
      border-radius: 30px;
      font-size: 18px;
      transition: 0.3s;
    }

    .next-button:hover {
      background: #28613B;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 28px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img src="Logo.JPG" alt="โลโก้บ้านกรงนก" class="logo">

    <h1>บ้านกรงนก</h1>
    <div class="english-name">Baan Krong Nok</div>

    <p class="description">
      ยินดีต้อนรับสู่บ้านกรงนก
      ร้านจำหน่ายกรงนกสวยงามทำมือ
      ซี่ดอกกรงนก และสะพานกรงนก
    </p>

    <p class="product-info">
      พร้อมบริการรับสั่งทำกรงนกและส่วนประกอบกรงนก
      ตามแบบที่ลูกค้าต้องการ สามารถแจ้งขนาด
      รูปทรง ลวดลาย และรายละเอียดเพิ่มเติมได้
    </p>

    <a href="./products.html" class="next-button">
      เลือกหมวดหมู่สินค้า →
    </a>

  </main>

</body>
</html>
