
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านกรงนก | Baan Krong Nok</title>
  <meta name="description" content="บ้านกรงนก จำหน่ายกรงนกสวยงาม ซี่ดอก อะไหล่กรง และอุปกรณ์สำหรับนก">

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Kanit', sans-serif;
      background: #FAFCF7;
      color: #294C35;
      line-height: 1.7;
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; }
    button { font: inherit; }

    header {
      background: #fff;
      padding: 12px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 105px;
      height: 105px;
      min-width: 105px;
      border-radius: 50%;
      border: 4px solid #39764A;
      background: #E5F0E2;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      display: block;
      transform: scale(.90);
    }

    .brand h1 {
      font-size: 25px;
      color: #28613B;
      line-height: 1.3;
    }

    .brand p { font-size: 13px; color: #68816D; }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: #315C3D;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover { color: #77A65E; }

    .hero {
      background: linear-gradient(135deg, #E6F1E1, #F7FAF2);
      padding: 65px 6%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-content { max-width: 760px; }

    .hero h2 {
      font-size: clamp(30px, 5vw, 46px);
      color: #28613B;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #58745D;
      margin-bottom: 25px;
    }

    .main-button {
      display: inline-block;
      background: #39764A;
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 500;
    }

    .main-button:hover { background: #285A37; }

    section { padding: 55px 6%; }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-size: 29px;
      color: #28613B;
    }

    .section-title p {
      color: #728574;
      margin-top: 5px;
    }

    /* CATEGORY */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }

    .category-card {
      display: block;
      background: #fff;
      border: 1px solid #E6EDE2;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
      transition: .2s;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(39,91,54,.12);
    }

    .category-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #EDF4E9;
    }

    .category-card h3 {
      color: #315D3B;
      font-size: 17px;
      padding: 12px 15px 2px;
    }

    .category-card p {
      color: #718071;
      font-size: 13px;
      padding: 0 15px 16px;
    }

    .status-message {
      text-align: center;
      padding: 22px;
      color: #68816D;
      background: #F1F6ED;
      border-radius: 12px;
      grid-column: 1 / -1;
    }

    .retry-button {
      display: block;
      margin: 12px auto 0;
      padding: 9px 22px;
      border: 0;
      border-radius: 25px;
      background: #39764A;
      color: white;
      cursor: pointer;
    }

    /* PRODUCTS */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #E6EDE2;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #F0F4EC;
    }

    .product-info { padding: 15px; }

    .product-info h3 {
      font-size: 17px;
      color: #315D3B;
      margin-bottom: 7px;
    }

    .product-info p {
      color: #718071;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .product-price {
      color: #39764A;
      font-size: 19px;
      font-weight: 600;
    }

    .view-all {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 10px 25px;
      background: #39764A;
      color: #fff;
      border-radius: 25px;
    }

    /* FEATURES */
    .features, .contact-section { background: #EDF4E9; }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .feature-card {
      text-align: center;
      background: #fff;
      padding: 25px 15px;
      border-radius: 16px;
    }

    .feature-card .icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .feature-card h3 {
      color: #39764A;
      margin-bottom: 5px;
    }

    /* ABOUT */
    .about-box {
      max-width: 850px;
      margin: auto;
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #E6EDE2;
    }

    .about-box p { color: #647968; }

    /* ORDER */
    .order-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .order-card {
      background: #fff;
      padding: 22px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #E4EDE0;
    }

    .order-card span { font-size: 32px; }
    .order-card h3 { color: #39764A; margin: 8px 0; }

    /* CONTACT */
    .contact-section { text-align: center; }

    .contact-box {
      max-width: 650px;
      margin: auto;
      background: #fff;
      border-radius: 18px;
      padding: 30px 20px;
    }

    .contact-box p {
      margin-bottom: 18px;
      color: #647968;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 22px;
    }

    .contact-link {
      display: block;
      padding: 14px 18px;
      border-radius: 30px;
      color: #fff;
      font-weight: 500;
      text-align: center;
    }

    .facebook-link { background: #1877F2; }
    .line-link { background: #06B65A; }
    .phone-link { background: #39764A; }

    /* FAQ */
    .faq-container { max-width: 800px; margin: auto; }

    .faq-item {
      background: #fff;
      border: 1px solid #E2EBDD;
      border-radius: 14px;
      margin-bottom: 14px;
      padding: 17px 20px;
    }

    .faq-item summary {
      color: #39764A;
      font-weight: 600;
      cursor: pointer;
    }

    .faq-item p {
      color: #647968;
      margin-top: 12px;
    }

    footer {
      background: #285A37;
      color: #fff;
      text-align: center;
      padding: 25px 15px;
    }

    footer p { font-size: 14px; }

    @media (max-width: 650px) {
      header {
        justify-content: center;
        text-align: center;
      }

      .brand { justify-content: center; }

      .brand-logo {
        width: 88px;
        height: 88px;
        min-width: 88px;
      }

      .brand h1 { font-size: 22px; }

      nav {
        justify-content: center;
        gap: 12px;
      }

      nav a { font-size: 14px; }

      .hero { padding: 48px 5%; }
      .hero p { font-size: 16px; }
      section { padding: 42px 5%; }

      .category-grid, .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .category-image { height: 135px; }

      .category-card h3 {
        font-size: 15px;
        padding: 10px 10px 2px;
      }

      .category-card p {
        font-size: 12px;
        padding: 0 10px 12px;
      }

      .product-card img { height: 155px; }
      .product-info { padding: 11px; }
      .product-info h3 { font-size: 15px; }
      .product-price { font-size: 17px; }
      .about-box { padding: 22px 17px; }
    }

    @media (max-width: 360px) {
      .category-grid, .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
