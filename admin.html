
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบผู้ดูแล | บ้านกรงนก</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#faf8ef;
 color:#17452b;
 font-family:Arial,sans-serif;
}
header{
 background:#174d2b;
 color:white;
 text-align:center;
 padding:20px;
}
main{
 max-width:450px;
 margin:45px auto;
 padding:18px;
}
.card{
 background:white;
 padding:25px;
 border-radius:18px;
 box-shadow:0 2px 10px #0001;
}
h2{text-align:center;color:#18834a}
label{display:block;margin-top:18px;font-weight:bold}
input{
 width:100%;
 padding:13px;
 margin-top:7px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:22px;
 background:#18834a;
 color:white;
 border:0;
 border-radius:25px;
 font-size:16px;
}
button:disabled{opacity:.6}
#message{
 margin-top:15px;
 line-height:1.6;
 text-align:center;
}
a{color:#174d2b}
.back{text-align:center;margin-top:20px}
</style>
</head>
<body>

<header>
<h2 style="color:white">🐦 บ้านกรงนก</h2>
ระบบผู้ดูแลร้าน
</header>

<main>
<div class="card">
<h2>เข้าสู่ระบบผู้ดูแล</h2>
<p style="text-align:center">
กรุณากรอกอีเมลและรหัสผ่านของผู้ดูแลร้าน
</p>

<form id="loginForm">
<label>อีเมล</label>
<input id="email" type="email" required
 autocomplete="username" placeholder="กรอกอีเมล">

<label>รหัสผ่าน</label>
<input id="password" type="password" required
 autocomplete="current-password" placeholder="กรอกรหัสผ่าน">

<button id="loginButton" type="submit">
เข้าสู่ระบบ
</button>
</form>

<div id="message" role="status"></div>
</div>

<div class="back">
<a href="index.html">← กลับสู่หน้าแรก</a>
</div>
</main>

<script>
const SUPABASE_URL = "https://acfrebknwxuybroilgqu.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit",async function(event){
 event.preventDefault();

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 button.disabled = true;
 button.textContent = "กำลังเข้าสู่ระบบ...";
 message.textContent = "";

 const {data,error} = await db.auth.signInWithPassword({
  email:email,
  password:password
 });

 if(error){
  message.textContent =
   "เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน";
  button.disabled = false;
  button.textContent = "เข้าสู่ระบบ";
  return;
 }

 if(data.session){
  location.href = "admin.html";
 }
});
</script>

</body>
</html>
