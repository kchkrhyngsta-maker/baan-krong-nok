<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายการสินค้า | บ้านกรงนก</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #FAFCF7;
  color: #294C35;
}
header {
  background: #174d2b;
  color: white;
  padding: 22px 15px;
  text-align: center;
}
header h1 { margin: 0; }
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 25px;
  padding: 15px;
  background: white;
}
nav a {
  color: #174d2b;
  text-decoration: none;
  font-weight: bold;
}
main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}
input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 12px;
  margin-bottom: 12px;
  font-size: 16px;
  background: white;
}
.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 7px #ddd;
}
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #eee;
}
.no-image {
  height: 180px;
  display: grid;
  place-items: center;
  background: #f1f1e8;
  font-size: 40px;
}
.info { padding: 13px; }
.info h3 {
  font-size: 17px;
  margin: 5px 0 8px;
}
.category-name {
  color: #777;
  font-size: 13px;
}
.description {
  font-size: 14px;
  color: #555;
  line-height: 1.6;
  min-height: 44px;
}
.price {
  font-size: 20px;
  font-weight: bold;
  color: #16824b;
  margin: 10px 0;
}
.stock {
  color: #666;
  font-size: 13px;
}
button {
  width: 100%;
  border: 0;
  padding: 12px;
  border-radius: 20px;
  background: #18834a;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin-top: 8px;
}
button:hover { background: #126638; }
.status {
  text-align: center;
  padding: 25px;
  grid-column: 1 / -1;
  background: white;
  border-radius: 12px;
}
.error { color: #a32626; }
footer {
  text-align: center;
  background: #174d2b;
  color: white;
  padding: 20px;
  margin-top: 35px;
}
@media(min-width:650px) {
  .products { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<header>
  <h1>🐦 บ้านกรงนก</h1>
  <p>กรงนกสวยงามและอุปกรณ์ตกแต่ง</p>
</header>
<nav>
  <a href="index.html">หน้าหลัก</a>
  <a href="categories.html">หมวดหมู่สินค้า</a>
  <a href="products.html">รายการสินค้า</a>
  <a href="contact.html">ติดต่อเรา</a>
</nav>
<main>
  <h2>🛒 สินค้าทั้งหมด</h2>

<input
id=“search”
type=“search”
placeholder=“🔍 ค้นหาชื่อสินค้า…”

  <select id="category">
    <option value="">สินค้าทุกประเภท</option>
  </select>
  <p id="count">กำลังโหลดสินค้า...</p>
  <div class="products" id="product-list">
    <p class="status">กำลังโหลดข้อมูล...</p>
  </div>
</main>
<footer>
  <h3>🐦 บ้านกรงนก</h3>
  <p>จำหน่ายกรงนกสวยงามและอุปกรณ์ตกแต่ง</p>
  <p>ขอบคุณที่ใช้บริการค่ะ</p>
</footer>
<script>
const SUPABASE_URL =
"https://acfrebknwxuybroilgqu.supabase.co";
const SUPABASE_KEY =
"sb_publishable_UjWZN8YsBLoBTKsbQ3GZsw_A1X3lSPK";
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
const list = document.getElementById("product-list");
const count = document.getElementById("count");
let products = [];
function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}
function safeImage(value) {
  if (!value) return "";
  try {
    const url = new URL(value);
    if (url.protocol === "https:" || url.protocol === "http:") {
      return url.href;
    }
  } catch {}
  return "";
}
function formatPrice(price) {
  if (price === null || price === undefined || price === "") {
    return "ยังไม่ได้ระบุราคา";
  }
  const number = Number(price);
  if (!Number.isFinite(number)) {
    return "ยังไม่ได้ระบุราคา";
  }
  return "฿" + number.toLocaleString("th-TH");
}
function showError(message) {
  count.textContent = "ไม่สามารถโหลดสินค้าได้";
  list.innerHTML = `
    <div class="status error">
      <h3>⚠️ โหลดสินค้าไม่สำเร็จ</h3>
      <p>${safeText(message)}</p>
      <button onclick="loadProducts()">ลองโหลดอีกครั้ง</button>
    </div>
  `;
}
async function loadProducts() {
  list.innerHTML =
    '<p class="status">กำลังโหลดสินค้า...</p>';
  count.textContent = "กำลังโหลดสินค้า...";
  try {
    const { data, error } = await db
      .from("products")
      .select("id,name,category,description,price,image_url,stock,is_active")
      .eq("is_active", true)
      .order("id", { ascending: false });
    if (error) throw error;
    products = Array.isArray(data) ? data : [];
    console.log("ข้อมูลสินค้าจาก Supabase:", products);
    const categories = [
      ...new Set(products.map(p => p.category).filter(Boolean))
    ];
    const select = document.getElementById("category");
    select.innerHTML =
      '<option value="">สินค้าทุกประเภท</option>';
    categories.forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });
    showProducts();
  } catch (error) {
    console.error(error);
    showError(error.message || "เกิดข้อผิดพลาดในการโหลดสินค้า");
  }
}
function showProducts() {
  const keyword = document
    .getElementById("search")
    .value.toLowerCase()
    .trim();
  const category = document.getElementById("category").value;
  const filtered = products.filter(p => {
    const name = String(p.name || "").toLowerCase();
    const description = String(p.description || "").toLowerCase();
    return (
      (name.includes(keyword) || description.includes(keyword)) &&
      (!category || p.category === category)
    );
  });
  count.textContent = "พบสินค้า " + filtered.length + " รายการ";
  if (filtered.length === 0) {
    list.innerHTML = `
      <p class="status">
        🛒 ยังไม่มีสินค้าที่ตรงกับการค้นหา
      </p>
    `;
    return;
  }
  list.innerHTML = filtered.map(p => {
    const image = safeImage(p.image_url);
    const description = p.description
      ? safeText(p.description)
      : "ยังไม่มีรายละเอียดสินค้า";
    const stock = p.stock === null || p.stock === undefined
      ? "ไม่ระบุจำนวนสินค้า"
      : "คงเหลือ " + Number(p.stock).toLocaleString("th-TH") + " ชิ้น";
    return `
      <div class="card">
        ${
          image
          ? `
            <img
              src="${safeText(image)}"
              alt="${safeText(p.name)}"
              onerror="this.outerHTML='<div class=no-image>🐦</div>'"
            >
          `
          : '<div class="no-image">🐦</div>'
        }
        <div class="info">
          <h3>${safeText(p.name)}</h3>
          <small class="category-name">
            ${safeText(p.category || "สินค้า")}
          </small>
          <p class="description">
            ${description}
          </p>
          <p class="price">
            ${formatPrice(p.price)}
          </p>
          <p class="stock">
            ${safeText(stock)}
          </p>
          <button onclick="viewProduct('${encodeURIComponent(p.id)}')">
            ดูรายละเอียดสินค้า
          </button>
        </div>
      </div>
    `;
  }).join("");
}
function viewProduct(id) {
  window.location.href =
    "product-detail.html?id=" + id;
}
document.getElementById("search")
  .addEventListener("input", showProducts);
document.getElementById("category")
  .addEventListener("change", showProducts);
loadProducts();
</script>
</body>
</html>
